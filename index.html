<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyber Defender</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <!-- START SCREEN -->
        <div id="start-screen">

            <div class="logo">🛡️</div>

            <h1>CYBER DEFENDER</h1>

            <p class="start-description">
                Defend the network from incoming cyber threats.
            </p>

            <div class="start-info">
                <p>🏆 High Score: <span id="start-high-score">0</span></p>
                <p>⏱️ Time: 30 seconds</p>
                <p>❤️ Lives: 3</p>
            </div>

            <button id="start-button">
                START GAME
            </button>

        </div>


        <!-- GAME SCREEN -->
        <div id="game-screen">

            <h1>🛡️ CYBER DEFENDER</h1>

            <p class="subtitle">
                Defend the network from cyber attacks!
            </p>


            <!-- HUD -->

            <div class="score-board">
                Score: <span id="score">0</span>
            </div>

            <div class="high-score">
                High Score: <span id="high-score">0</span>
            </div>

            <div class="timer">
                Time: <span id="timer">30</span>s
            </div>

            <div class="lives">
                Lives: <span id="lives">❤️❤️❤️</span>
            </div>

            <div class="difficulty">
                Level: <span id="difficulty">EASY</span>
            </div>


            <!-- ACHIEVEMENT -->
          <div id="achievement">
    🎯 FIRST HIT!
</div>

<div id="combo-achievement">
    🔥 COMBO 5!
</div>
            <div id="master-achievement">
    💀 CYBER MASTER!
</div>
            
            <!-- GAME AREA -->

            <div id="game-area">

                <div id="message">
                    GAME OVER
                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
